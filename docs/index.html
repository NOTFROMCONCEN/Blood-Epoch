<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2019 血疫纪元</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #0c0c10;
  color: #dcdce4;
  overflow: hidden;
  height: 100vh;
}
::selection { background: rgba(200,40,40,0.45); color: #fff; }

/* Focus */
:focus-visible {
  outline: 2px solid rgba(200,40,40,0.5);
  outline-offset: 2px;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

.landing {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: #0c0c10;
}
#canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
.content {
  position: relative; z-index: 2;
  text-align: center; padding: 2rem;
}
.date {
  font-size: 0.85rem; letter-spacing: 0.5em;
  color: rgba(220,50,50,0.7); margin-bottom: 2rem;
  font-family: 'Courier New', monospace;
  text-transform: uppercase;
}
.title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2.5rem, 8vw, 5.5rem);
  font-weight: 700; color: #e8e8f0;
  letter-spacing: 0.15em; margin-bottom: 0.3em;
  text-shadow: 0 0 60px rgba(200,40,40,0.4);
  animation: pulse 4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { text-shadow: 0 0 60px rgba(200,40,40,0.4); }
  50% { text-shadow: 0 0 80px rgba(200,40,40,0.6), 0 0 120px rgba(200,40,40,0.25); }
}
.sub {
  font-size: clamp(0.9rem, 2.5vw, 1.1rem);
  color: rgba(220,220,228,0.55); margin-bottom: 4rem;
  letter-spacing: 0.3em; font-weight: 300;
}
.enter {
  display: inline-block; padding: 0.8em 3em;
  border: 1px solid rgba(200,40,40,0.5);
  color: rgba(220,220,228,0.8);
  font-size: 0.9rem; letter-spacing: 0.3em;
  cursor: pointer; background: transparent;
  font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.4s ease; position: relative; overflow: hidden;
  text-decoration: none;
}
.enter::before {
  content: ''; position: absolute; inset: 0;
  background: rgba(200,40,40,0.1);
  transform: translateX(-100%);
  transition: transform 0.4s ease;
}
.enter:hover { border-color: rgba(200,40,40,0.9); color: #f8f8ff; }
.enter:hover::before { transform: translateX(0); }
.enter:active { transform: scale(0.97); }

.quote {
  position: absolute; bottom: 3rem; left: 50%; transform: translateX(-50%);
  font-size: 0.75rem; color: rgba(220,220,228,0.35);
  letter-spacing: 0.2em; text-align: center; width: 90%;
  font-style: italic;
}
</style>
</head>
<body>

<div class="landing">
  <canvas id="canvas"></canvas>
  <div class="content">
    <div class="date">X CITY &mdash; NOVEMBER 2019</div>
    <h1 class="title">血疫纪元</h1>
    <div class="sub">2019</div>
    <a class="enter" href="app.html">&emsp;进 入&emsp;</a>
  </div>
  <div class="quote">"世界需要安宁，而我们，负责带来这种安宁。不惜任何代价。"</div>
</div>

<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: -Math.random() * 0.4 - 0.1,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.15 + 0.02,
      color: Math.random() > 0.5 ? '180,30,30' : '100,140,200'
    });
  }

  var rafId = null;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.color + ',' + p.a + ')';
      ctx.fill();
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;
    });
    rafId = requestAnimationFrame(draw);
  }
  draw();

  // Pause animation when tab is hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
    else if (!rafId) draw();
  });
})();
</script>

</body>
</html>
