cursor: pointer;  font-family: 'Noto Sans SC', sans-serif;  transition: all 0.3s;  display: flex; flex-direction: column; align-items: center; gap: 0.2rem;}.station-btn .freq { font-family: 'Orbitron', monospace; font-size: 0.7rem; color: rgba(255,140,40,0.5); }.station-btn:hover, .station-btn.active {  background: rgba(255,140,40,0.12);  border-color: rgba(255,140,40,0.4);  color: #e8e8f0;}.station-btn.active .freq { color: rgba(255,140,40,0.9); }/* Status Bar */.status-bar {  display: flex; justify-content: space-between; align-items: center;  margin-top: 1rem; padding-top: 0.8rem;  border-top: 1px solid rgba(255,140,40,0.06);}.status-item {  font-size: 0.68rem; color: rgba(220,220,228,0.3);  font-family: 'Courier New', monospace;}.status-item .val { color: rgba(255,140,40,0.5); }/* ===== TRANSCRIPT PANEL ===== */.transcript-panel {  background: rgba(14,14,18,0.95);  border: 1px solid rgba(255,140,40,0.08);  border-radius: 8px;  overflow: hidden;}.transcript-header {  display: flex; align-items: center; justify-content: space-between;  padding: 1rem 1.5rem;  border-bottom: 1px solid rgba(255,140,40,0.08);  background: rgba(255,140,40,0.02);}.transcript-header h2 {  font-family: 'Noto Serif SC', serif;  font-size: 1rem; color: #e8e8f0;}.transcript-header .tag {  font-size: 0.65rem; padding: 0.2em 0.6em;  background: rgba(255,140,40,0.12);  color: rgba(255,140,40,0.8);  border-radius: 3px; letter-spacing: 0.05em;}.transcript-body {  padding: 2rem;  font-family: 'Noto Serif SC', serif;  font-size: 0.95rem; line-height: 1.9;  color: #d8d8e0;}/* Radio Script Formatting */.transcript-body .sfx {  display: block; margin: 1rem 0;  padding: 0.5rem 1rem;  background: rgba(0,0,0,0.3);  border-left: 3px solid rgba(255,140,40,0.3);  font-size: 0.82rem;  color: rgba(255,140,40,0.6);  font-style: italic;}.transcript-body .host {  margin: 0.8rem 0 0.3rem;}.transcript-body .host .name {  display: inline-block;  padding: 0.15em 0.5em;  background: rgba(255,140,40,0.1);  border-radius: 3px;  color: rgba(255,140,40,0.85);  font-size: 0.82rem;  font-weight: 700;  font-family: 'Noto Sans SC', sans-serif;  margin-right: 0.5rem;}.transcript-body .host .name.caller {  background: rgba(59,130,246,0.12);  color: rgba(96,165,250,0.85);}.transcript-body .dialogue {  margin-left: 0.5rem;  color: #dcdce4;}.transcript-body .analysis {  margin: 1.5rem 0;  padding: 1rem 1.2rem;  background: rgba(255,140,40,0.03);  border: 1px solid rgba(255,140,40,0.1);  border-radius: 6px;  font-size: 0.85rem;  color: rgba(220,220,228,0.7);}.transcript-body .analysis h4 {  color: rgba(255,140,40,0.7);  font-size: 0.8rem;  margin-bottom: 0.5rem;  letter-spacing: 0.1em;}.transcript-body .note {  font-size: 0.82rem;  color: rgba(220,220,228,0.5);  font-style: italic;  margin: 0.5rem 0;}.transcript-body hr {  border: none; margin: 1.5rem auto;  width: 30%; height: 1px;  background: linear-gradient(90deg, transparent, rgba(255,140,40,0.2), transparent);}.transcript-body h1, .transcript-body h2, .transcript-body h3 {  font-family: 'Noto Serif SC', serif;  color: #eaeaf2; margin: 1.5rem 0 0.8rem;}.transcript-body h1 { font-size: 1.3rem; }.transcript-body h2 { font-size: 1.15rem; }.transcript-body h3 { font-size: 1rem; }.transcript-body strong { color: #f0f0f8; }.transcript-body em { color: rgba(220,220,228,0.8); }.transcript-body p { margin-bottom: 0.8em; }.transcript-body blockquote {  margin: 1rem 0; padding: 0.8rem 1.2rem;  border-left: 3px solid rgba(255,140,40,0.3);  font-style: italic; color: rgba(220,220,228,0.75);}/* ===== NOISE OVERLAY ===== */.noise-overlay {  position: fixed; inset: 0; z-index: 1; pointer-events: none;  background: repeating-linear-gradient(    0deg,    transparent,    transparent 2px,    rgba(0,0,0,0.03) 2px,    rgba(0,0,0,0.03) 4px  );  opacity: 0.5;}/* ===== RESPONSIVE ===== */@media (max-width: 640px) {  .receiver { padding: 0 1rem; margin-top: 4rem; }  .dial-panel { padding: 1.5rem 1rem 1rem; }  .transcript-body { padding: 1.2rem; }  .station-btn { padding: 0.5rem 1rem; font-size: 0.75rem; }}</style></head><body><div class="noise-overlay"></div><!-- Header --><header class="site-header">  <a class="logo" href="index.html">2019 <span>血疫纪元</span></a>  <div style="display:flex;gap:1rem;align-items:center;">

  </div></header><!-- Receiver --><div class="receiver">  <!-- Dial Panel -->  <div class="dial-panel">    <div class="freq-display">      <div class="freq-number" id="freq-num">87.7<span class="freq-unit">MHz</span></div>      <div class="station-name" id="station-label">FM87.7 城市脉搏</div>      <div class="station-show" id="show-label">《你好，X市！》</div>    </div>    <div class="waveform active" id="waveform"></div>    <div class="station-selector">      <button class="station-btn active" onclick="switchStation(0)">        FM87.7        <span class="freq">早间节目</span>      </button>      <button class="station-btn" onclick="switchStation(1)">        FM101.7        <span class="freq">午间交通</span>      </button>    </div>    <div class="status-bar">      <span class="status-item">SIGNAL <span class="val">████████░░</span></span>      <span class="status-item">STEREO</span>      <span class="status-item" id="time-display">2019.11.19 09:15</span>    </div>  </div>  <!-- Transcript -->  <div class="transcript-panel">    <div class="transcript-header">      <h2 id="transcript-title">关于大桥事故</h2>      <span class="tag" id="transcript-tag">电台转录</span>    </div>    <div class="transcript-body" id="transcript-body"></div>  </div></div><!-- Hidden Content Sources (must be before script) --><div style="display:none"><textarea id="radio-bridge-content"># 关于大桥事故---**[音效：轻快活泼的城市流行音乐淡出]****[音效：FM电台Jingle声]****Jingle:**  "FM87.7，城市脉搏，与你同步。《你好，X市！》"**主持人阿哲：**  早上好各位！现在是上午九点十五分，欢迎锁定FM87.7，我是你们的老朋友阿哲。今天上班的路况怎么样？有没有朋友像我一样，昨天在长江二桥上体验了一把'静态人生'的？我的天，堵得那叫一个水泄不通！**[音效：轻松的背景音乐垫底]****阿哲：**  昨天没听节目的朋友可能还不知道，就在早高峰，二桥上出了个不大不小的意外。一辆'北极星冷链'的大货车，对，就是那个蓝白色车身、画着个星星的那个公司，突然就停在主车道上了。官方通报说是车辆机械故障，驾驶员身体不适，已经被送到医院了。不过呢，这事儿在咱们的听友群里可是炸开了锅。来，我们接通第一位听众，李先生。**[音效：电话接通声]****李先生：**  阿哲你好！我昨天就在那辆货车后面大概第五辆车的位置，我看得清清楚楚！**阿哲：**  哦？李先生，快给我们讲讲现场第一手的情况！**李先生：**  那司机根本不像是'身体不适'那么简单！他从驾驶室里晃晃悠悠地下来，我开始还以为是中暑或者低血糖。结果他一句话不说，就对着自己的车门又抓又挠，后来甚至开始用头去撞集装箱！那样子……特别吓人，跟电影里演的似的，眼睛都是红的。警察来了他还在那儿折腾，最后好像是直接抽搐倒地了，救护车才把他拉走。**阿哲：**  哇哦……听起来确实有点超乎想象。用头撞车？这听着可不像是普通的急病。不过李先生，大热天的，也可能是突发性的精神障碍，或者……狂犬病？这几年好像也偶有报道。希望这位司机师傅能没事吧。**李先生：**  可能吧……但还有个事儿特奇怪。他那个冷链车，车厢后面一直在冒白烟，不是尾气，是那种……像是从冰箱里冒出来的冷气，还带着一股说不出来的味道，不是海鲜的腥味，也不是坏肉的臭味，就……有点像消毒水和金属混合的味道。反正周围的空气都感觉凉飕飕的。**阿哲：**  嗯……冷链车嘛，制冷剂泄露也是有可能的。这'北极星'公司可得好好查查他们车辆的安全性了，这又是司机出状况，又是车辆疑似泄露的，太危险了。感谢李先生的来电，开车注意安全啊！**[音效：电话挂断声]****阿哲：**  好，各位听众，刚才李先生描述的场景确实有点……戏剧性。不过我们还是要相信官方的调查结果。说起来，这个'北极星公司'最近可是咱们市的明星企业啊。下个月的'国际农业博览会'，所有外宾的接待酒店，还有那些金贵的海外展品的运输，可全都包给他们了。希望他们能把重心放在安全上，别在国际友人面前再出这种岔子了。**阿哲：**  好了，一首好听的歌曲送给大家，之后我们再来聊聊，博览会期间，市中心哪些路段可能会进行交通管制……**[音效：舒缓的流行音乐渐渐响起，压过主持人的声音]**---### 播报内容分析1. **公众视角：**  主持人和听众将事件定义为"奇怪的交通事故"和"司机突发怪病"，符合公众在危机初期的认知水平。2. **线索植入：**    - **司机行为：**  "用头撞车""眼睛发红""抽搐"，完美复现了病毒侵入神经系统后的早期症状。    - **冷链车异常：**  "冒白烟"、"消毒水和金属混合的味道"，暗示了泄露源。    - **公司串联：**  主持人将"北极星冷链"和"国际农业博览会"以及"北极星酒店"联系起来。3. **舆论导向：**  主持人扮演了"稳定器"的角色，试图用"精神障碍""狂犬病""制冷剂泄露"来引导舆论。4. **叙事节奏：**  通过听众电话和主持人评论的互动，将阴谋论核心事件包装成了市民日常八卦。</textarea><textarea id="radio-traffic-content"># 交通节目### **电台片段生成****电台频道：**  FM101.7 X市交通音乐广播**节目名称：**  《畅行午高峰》**播出时间：**  2019年11月21日，中午12:35**主持人：**  小飞 (男)，佳佳 (女)---**[音效：一段活泼、快节奏的电子音乐Jingle，结尾是清脆的"FM101.7"人声]****小飞：**  FM101.7，音乐在路上！各位听友好，这里是全城堵车你堵心，我们陪你聊聊天的《畅行午高峰》，我是小飞！**佳佳：**  我是佳佳。提醒刚刚吃过午饭正在返回工作岗位的司机朋友们，饭后血液集中在胃部，容易犯困，可以把车窗打开一条缝，让冷风帮您提提神哦。**小飞：**  说得没错！提神醒脑，安全第一！好了，让我们快速进入今天的'路况快报'环节。佳佳，今天咱们的交通热线，可是有点'热闹'啊。**佳佳：**  是的呢，常规的堵点，比如高新区往三环方向、过江隧道入口，依然是车流量比较大。但今天我们想特别说一个……嗯，'突发状况'。**小飞：**  哎呀，何止是突发状况！简直是'火爆'！就在刚刚过去的半小时里，我们接连接到三位听众打来的热线，说的都是同一件事——常青立交桥上的一起小事故。**[音效：轻微的汽车鸣笛声和街道环境音作为背景，音量很低]****佳佳：**  是一起追尾刮蹭，对吗？**小飞：**  对！就是那种补漆笔就能搞定的小刮蹭。但是！两位司机下车后的反应，可一点都不'小'。据我们的热心听友'追风少年'在微信群里发来的现场照片看，那场面，啧啧，堪比拳击比赛现场！**佳佳：**  有那么夸张吗？**小飞：**  有！据说两位司机，一位大哥一位大姐，下车后一句话没说，就开始互相指着对方嘶吼，不是那种理论的争吵，而是那种……怎么形容呢，就是纯粹的、野兽般的嘶吼，脖子上青筋都爆出来了。然后就扭打在了一起，旁边好几位想拉架的市民都愣是没拉开。最后警察叔叔赶到，费了好大劲才把两人控制住，听说直接带走去强制醒酒了。**佳佳：**  唉，这又是典型的'路怒症'升级事件了。真的要在这里提醒各位在路上的朋友，保持平和心态至关重要。一点小摩擦，退一步海阔天空，没必要把情绪宣泄在马路上，既危险，又难看。**小飞：**  佳佳说得对！天干物燥，小心肝火嘛！最近天气就是这样，人容易烦躁。所以啊，大家开车的时候，不妨把我们FM101.7的音量调大一点，让好音乐给您的心情做个SPA。好了，不说这件'上火'的事了，接下来，送上一首林俊杰的《不为谁而作的歌》，希望大家的路途，都能像歌声一样，温柔顺畅。**[音效：林俊杰的歌曲前奏缓缓响起，逐渐盖过主持人的声音，电台节目进入音乐时段]**---### 潜台词/真相解读这段广播完美地将SBC病毒初期感染者的情绪失控、攻击性异常增强、失去理智的嘶吼，包装成了一个常见的社会现象——路怒症。主持人的调侃和轻松的归因（"天干物燥"），使得这条预示着城市危机的关键线索，被彻底消解在日常信息的洪流中，成为市民午后一段无关紧要的谈资。对于正在追踪线索的情报人员来说，这可能只是一条会被忽略的背景噪音；但对于事后的幸存者而言，这却是风暴来临前，被所有人错过的最后一声警钟。</textarea></div><script>// ===== STATION DATA (lazy content loading) =====const stations = [  { freq: '87.7', name: 'FM87.7 城市脉搏', show: '《你好，X市！》', time: '2019.11.19 09:15', title: '关于大桥事故', contentId: 'radio-bridge-content' },  { freq: '101.7', name: 'FM101.7 交通音乐广播', show: '《畅行午高峰》', time: '2019.11.21 12:35', title: '交通节目', contentId: 'radio-traffic-content' }];let currentStation = 0;// ===== WAVEFORM =====const waveform = document.getElementById('waveform');for (let i = 0; i < 60; i++) {  const bar = document.createElement('div');  bar.className = 'bar';  const h1 = Math.random() * 30 + 5;  const h2 = Math.random() * 40 + 5;  const h3 = Math.random() * 25 + 5;  const h4 = Math.random() * 35 + 5;  bar.style.setProperty('--h1', h1 + 'px');  bar.style.setProperty('--h2', h2 + 'px');  bar.style.setProperty('--h3', h3 + 'px');  bar.style.setProperty('--h4', h4 + 'px');  bar.style.animationDelay = (Math.random() * 2) + 's';  bar.style.animationDuration = (1 + Math.random() * 1.5) + 's';  bar.style.height = h1 + 'px';  waveform.appendChild(bar);}// ===== PARSE & RENDER RADIO SCRIPT =====function parseRadioScript(md) {  let html = '';  const lines = md.split('\n');  let inAnalysis = false;  let analysisBuf = [];  let inBlockquote = false;  let quoteBuf = [];  for (let i = 0; i < lines.length; i++) {    let line = lines[i].trim();    // Skip meta lines that are file-level notes    if (line.startsWith('好的，') && line.includes('生成')) continue;    if (line.startsWith('这份') && line.includes('设计')) continue;    // Empty line    if (!line) {      if (inBlockquote && quoteBuf.length) {        html += `<blockquote>${quoteBuf.join('<br>')}</blockquote>`;        quoteBuf = []; inBlockquote = false;      }      continue;    }    // Horizontal rule    if (/^---+$/.test(line)) {      html += '<hr>';      continue;    }    // Section headers (analysis sections)    if (line.startsWith('###') && (line.includes('分析') || line.includes('解读') || line.includes('真相'))) {      inAnalysis = true;      html += `<div class="analysis"><h4>${line.replace(/^#+\s*/, '').replace(/\*\*/g, '')}</h4>`;      continue;    }    if (line.startsWith('###') && !inAnalysis) {      html += `<h3>${inlineFmt(line.replace(/^#+\s*/, ''))}</h3>`;      continue;    }    if (line.startsWith('##')) {      html += `<h2>${inlineFmt(line.replace(/^#+\s*/, ''))}</h2>`;      continue;    }    if (line.startsWith('#')) {      html += `<h1>${inlineFmt(line.replace(/^#+\s*/, ''))}</h1>`;      continue;    }    // Blockquote    if (line.startsWith('>')) {      inBlockquote = true;      quoteBuf.push(inlineFmt(line.replace(/^>\s?/, '')));      continue;    }    // Sound effects    if (line.match(/\[.*音效.*\]/) || line.match(/\(音效.*\)/)) {      html += `<div class="sfx">${line.replace(/[\[\]()\*]/g, '')}</div>`;      continue;    }    // Host/caller lines - detect "name：" or "name:" pattern    const hostMatch = line.match(/^(?:\*\*)?([\u4e00-\u9fff\w]+)(?:\s*[\(（].*?[\)）])?(?:\*\*)?\s*[：:]\s*(.*)/);    if (hostMatch) {      const name = hostMatch[1].replace(/\*/g, '');      const dialogue = hostMatch[2] || '';      const isCaller = name.includes('先生') || name.includes('听友') || name.includes('追风');      html += `<div class="host">        <span class="name ${isCaller ? 'caller' : ''}">${name}</span>        <span class="dialogue">${inlineFmt(dialogue)}</span>      </div>`;      continue;    }    // Analysis content (inside analysis block)    if (inAnalysis) {      if (line.match(/^\d+\.\s/) || line.match(/^[-*]\s/)) {        html += `<p style="margin-left:1rem;">${inlineFmt(line)}</p>`;      } else if (line.startsWith('**') && line.endsWith('**')) {        html += `<p><strong>${line.replace(/\*\*/g, '')}</strong></p>`;      } else {        html += `<p>${inlineFmt(line)}</p>`;      }      // Check if analysis block should end (next non-empty line is a section header or ---)      const nextLine = (i + 1 < lines.length) ? lines[i + 1].trim() : '';      if (nextLine === '' || nextLine.startsWith('#') || nextLine.startsWith('---')) {        html += '</div>';        inAnalysis = false;      }      continue;    }    // Regular paragraph    html += `<p>${inlineFmt(line)}</p>`;  }  if (inAnalysis) html += '</div>';  return html;}function inlineFmt(text) {  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');  text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');  text = text.replace(/`([^`]+)`/g, '<code style="background:rgba(255,140,40,0.08);padding:0.1em 0.3em;border-radius:2px;font-size:0.9em;">$1</code>');  return text;}// ===== SWITCH STATION =====function switchStation(index) {  currentStation = index;  const s = stations[index];  // Update display  document.getElementById('freq-num').innerHTML = s.freq + '<span class="freq-unit">MHz</span>';  document.getElementById('station-label').textContent = s.name;  document.getElementById('show-label').textContent = s.show;  document.getElementById('time-display').textContent = s.time;  document.getElementById('transcript-title').textContent = s.title;  // Lazy-load content from textarea  const content = document.getElementById(s.contentId).textContent;  document.getElementById('transcript-body').innerHTML = parseRadioScript(content);  // Update buttons  document.querySelectorAll('.station-btn').forEach((btn, i) => {    btn.classList.toggle('active', i === index);  });  // Fade in transcript  const body = document.getElementById('transcript-body');  body.style.opacity = '0';  body.style.transform = 'translateY(10px)';  setTimeout(() => {    body.style.transition = 'opacity 0.4s ease, transform 0.4s ease';    body.style.opacity = '1';    body.style.transform = 'translateY(0)';  }, 50);  // Brief static effect on waveform  waveform.classList.remove('active');  setTimeout(() => waveform.classList.add('active'), 300);}// ===== INIT =====switchStation(0);</script><!-- Content is in textarea elements above the script --></body></html>
